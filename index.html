<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script type="importmap">
      {
        "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>
    <script src="./web/code.js" type="module"></script>
    <style>
      body {
        margin: 0;
      }
      #container {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }
      #control {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 999;
        display: flex;
        justify-content: left;
        flex-direction: column;

        #visual-console {
          /* This should make text to emulate computer console style font */
          font-family: monospace;
          font-size: 12px;
          color: white;
          background-color: rgba(0, 0, 0, 0.5);
          padding: 10px;
          margin-top: 10px;
          min-width: 300px;
          max-height: 300px;
          overflow-y: auto;
          overflow-x: auto;
          scrollbar-width: thin;
          max-width: 50vw;

          &.hidden {
            display: none;
          }
        }
      }

      #repo-link {
        position: absolute;
        top: 0;
        right: 0;
        z-index: 999;
        padding: 5px;
        margin: 5px;
        color: white;
        border: 1px solid white;
        border-radius: 5px;
        box-shadow: 0 0 5px black;
        text-shadow: 0 0 5px black;
        text-decoration: none;
        font-family: monospace;
        font-size: 12px;
      }

      #custom-scanning-overlay {
        img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
      }

      #toggleDebugButton {
        display: none;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="control">
      <div>
        <button id="startButton">Start</button>
        <button id="stopButton">Stop</button>
        <button id="toggleDebugButton">Debug?</button>
        <button id="toggleVisualConsoleButton" class="debug hidden">JS Console</button>
        <button id="clearVisualConsoleButton" class="debug hidden">Clear Console</button>
      </div>
      <div id="visual-console" class="debug hidden">

      </div>
    </div>
    <!-- <a id="repo-link" href="https://github.com/javibu13/ar-card" target="_blank">View on GitHub</a> -->
    <div id="container">
    </div>
    <div id="custom-scanning-overlay" class="mindar-ui-overlay mindar-ui-scanning hidden">
      <div class="scanning">
        <div class="inner">
          <img src="./web/3d/scannerTextureWB.png" alt="scannerTexture"/>
          <div class="scanline">
        </div>
      </div>
    </div>
  </body>
</html>
